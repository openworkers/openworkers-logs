[package]
name = "openworkers-logs"
version = "0.1.1"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
actix-web-lab = "0.23.0"
tokio = { version = "1.43.0", features = ["full"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
async-nats = "0.37"
futures = "0.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.137"
log = "0.4.21"
env_logger = "0.11.6"
dotenv = "0.15.0"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
async-stream = "0.3"

[profile.release]
strip = true
opt-level = "z"
incremental = true
codegen-units = 1
lto = true

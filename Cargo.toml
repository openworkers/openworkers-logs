[package]
name = "openworkers-logs"
version = "0.1.9"
edition = "2024"

[features]
websocket = ["dep:actix-ws"]

[dependencies]
actix-web = "4.12.1"
actix-web-lab = "0.27.0"
actix-ws = { version = "0.4", optional = true }
tokio = { version = "1.43.0", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
async-nats = "0.50.0"
futures = "0.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.137"
log = "0.4.21"
env_logger = "0.11.6"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
async-stream = "0.3"
dotenvy = "0.15.7"

[profile.release]
strip = true
opt-level = "z"
incremental = true
codegen-units = 1
lto = true
